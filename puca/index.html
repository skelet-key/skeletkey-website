<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puca — Album | SkeletKey</title>
  <meta name="description" content="Puca — the first album from SkeletKey. Stream the full set on SoundCloud." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <style>
    .music-page {
      min-height: 100vh;
      padding: 6.5rem 1.5rem 4rem;
      max-width: 920px;
      margin: 0 auto;
    }
    .music-page .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    .music-page h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }
    .music-page h1 span { color: var(--accent); }
    .music-page .lead {
      color: var(--text-secondary);
      font-size: 1.05rem;
      max-width: 36rem;
      margin-bottom: 2rem;
      line-height: 1.65;
    }
    .sc-embed {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: 0 16px 48px rgba(0,0,0,0.35);
    }
    .sc-embed iframe {
      display: block;
      width: 100%;
      border: 0;
      min-height: 450px;
    }
    .music-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.75rem;
    }
    .music-actions a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.7rem 1.2rem;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    .music-actions a:hover {
      border-color: var(--accent);
      background: var(--surface);
    }
    .music-actions a.primary {
      background: var(--brake-red);
      border-color: var(--brake-red);
      color: #fff;
    }
    .music-actions a.primary:hover {
      background: var(--brake-red-hover);
      border-color: var(--brake-red-hover);
    }
    .nav-links a.active {
      color: #fff;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-logo">
      <img
        src="/assets/skeletkey-logo-key-nav.png"
        srcset="/assets/skeletkey-logo-key-nav.png 2x, /assets/skeletkey-logo-key-nav@3x.png 3x"
        alt=""
        class="nav-logo-key"
        width="42"
        height="40"
      />
      <span class="nav-logo-text">Skelet<span>Key</span></span>
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="/#bike">The Bike</a></li>
      <li><a href="/#story">Story</a></li>
      <li><a href="/puca/" class="active">Music</a></li>
      <li><a href="/#order" class="nav-cta">Order</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
  </nav>

  <main class="music-page">
    <p class="eyebrow">First album</p>
    <h1>Puca</h1>
    <p class="lead">
      The first SkeletKey album — named for the motorcycle. Stream the full set below, or open it on SoundCloud.
    </p>

    <div class="sc-embed">
      <iframe
        title="Puca — SkeletKey on SoundCloud"
        width="100%"
        height="450"
        scrolling="no"
        frameborder="no"
        allow="autoplay"
        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/2103018351&amp;color=%23c41e3a&amp;auto_play=false&amp;hide_related=false&amp;show_comments=true&amp;show_user=true&amp;show_reposts=false&amp;show_teaser=true&amp;visual=true"
      ></iframe>
    </div>

    <div class="music-actions">
      <a class="primary" href="https://soundcloud.com/skeletkey/sets/puca" target="_blank" rel="noopener noreferrer">
        Open on SoundCloud ↗
      </a>
      <a href="/">← Back to SkeletKey</a>
    </div>
  </main>

  <script>
    (function () {
      var toggle = document.getElementById("navToggle");
      var links = document.getElementById("navLinks");
      if (toggle && links) {
        toggle.addEventListener("click", function () {
          links.classList.toggle("open");
        });
      }
    })();
  </script>
</body>
</html>
